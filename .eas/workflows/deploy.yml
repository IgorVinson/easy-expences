name: Production release

# Push to main -> build + submit both platforms automatically.
on:
  push:
    branches:
      - main

jobs:
  build_ios:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android (production)
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS to App Store
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  submit_android:
    name: Submit Android to Play Store
    needs: [build_android]
    type: submit
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
